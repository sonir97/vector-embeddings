services:
  embedding-demo:
    profiles: ["demo"]
    build: .
    environment:
      HF_HOME: /models
      DATABASE_URL: postgresql://vectors:vectors@postgres:5432/vectors
    volumes:
      - embedding-model-cache:/models
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["learn-embeddings"]

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vectors
      POSTGRES_USER: vectors
      POSTGRES_PASSWORD: vectors
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vector-postgres-data:/var/lib/postgresql/data
      - ./sql/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectors -d vectors"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  embedding-model-cache:
  vector-postgres-data:
